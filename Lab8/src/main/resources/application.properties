# Server
server.port=8080

# --- Datasource: Microsoft SQL Server (replace placeholders) ---
# Example JDBC URL:
# jdbc:sqlserver://<HOST>:<PORT>;databaseName=<DB_NAME>
spring.datasource.url=jdbc:sqlserver://YOUR_SQLSERVER_HOST:1433;databaseName=Lab8DB
spring.datasource.username=sa
spring.datasource.password=Aa@123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Use this when you will create schema externally via SQL script. Set to 'update' if you want Hibernate to create/update schema automatically.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Mail (example - replace with real credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Thymeleaf
spring.thymeleaf.cache=false
