<!-- Category Form Fragment -->
<th:block th:fragment="_form">
<form action="/category/index" th:object="${item}">
    <div class="row">
        <div class="col-md-5">
            <label for="id" class="form-label">Mã danh mục:</label>
            <input th:field="*{id}" id="id" class="form-control" placeholder="Nhập mã danh mục" required/>
        </div>
        <div class="col-md-5">
            <label for="name" class="form-label">Tên danh mục:</label>
            <input th:field="*{name}" id="name" class="form-control" placeholder="Nhập tên danh mục" required/>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" formaction="/category/create" class="btn btn-success btn-sm me-1">
                <i class="fas fa-plus"></i> Thêm
            </button>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-12 text-center">
            <button type="submit" formaction="/category/update" class="btn btn-primary me-2">
                <i class="fas fa-save"></i> Cập nhật
            </button>
            <a th:href="@{|/category/delete/${item.id}|}" class="btn btn-danger me-2"
               onclick="return confirm('Bạn có chắc chắn muốn xóa?')">
                <i class="fas fa-trash"></i> Xóa
            </a>
            <a href="/category/index" class="btn btn-secondary">
                <i class="fas fa-refresh"></i> Làm mới
            </a>
        </div>
    </div>
</form>
</th:block>
