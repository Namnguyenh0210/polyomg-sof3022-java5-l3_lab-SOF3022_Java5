<!-- Category Table Fragment -->
<th:block th:fragment="_table">
<div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Mã danh mục</th>
                <th>Tên danh mục</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:each="item: ${items}">
                <tr>
                    <td><span class="badge badge-id" th:text="${item.id}"></span></td>
                    <td class="fw-bold" th:text="${item.name}"></td>
                    <td>
                        <a th:href="@{|/category/edit/${item.id}|}" class="btn btn-info btn-sm">
                            <i class="fas fa-edit"></i> Sửa
                        </a>
                    </td>
                </tr>
            </th:block>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="3" class="text-center text-muted">
                    <i class="fas fa-inbox fa-2x mb-2"></i>
                    <p>Chưa có danh mục nào</p>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</th:block>
