<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Product Pagination & Sorting</title>
</head>
<body>
    <h3>PAGINATION & SORTING BY <span th:text="${field}"></span></h3>
    <table border="1" style="width:100%">
        <tr>
            <th><a th:href="@{|/product/paginate-sort?field=id|}">Id</a></th>
            <th><a th:href="@{|/product/paginate-sort?field=name|}">Name</a></th>
            <th><a th:href="@{|/product/paginate-sort?field=price|}">Price</a></th>
            <th><a th:href="@{|/product/paginate-sort?field=createDate|}">Date</a></th>
        </tr>
        <th:block th:each="item: ${page.content}">
            <tr>
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.createDate}"></td>
            </tr>
        </th:block>
    </table>
    <a th:href="@{|/product/paginate-sort?p=0|}">First</a>
    <a th:href="@{|/product/paginate-sort?p=${page.number - 1}|}">Previous</a>
    <a th:href="@{|/product/paginate-sort?p=${page.number + 1}|}">Next</a>
    <a th:href="@{|/product/paginate-sort?p=${page.totalPages - 1}|}">Last</a>
    <ul>
        <li>Số thực thể hiện tại: [[${page.numberOfElements}]]</li>
        <li>Trang số: [[${page.number}]]</li>
        <li>Kích thước trang: [[${page.size}]]</li>
        <li>Tổng số thực thể: [[${page.totalElements}]]</li>
        <li>Tổng số trang: [[${page.totalPages}]]</li>
    </ul>
</body>
</html>
