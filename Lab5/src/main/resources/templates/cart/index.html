<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Giỏ hàng của bạn</h3>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, iterStat : ${items}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${item.product.name}"></td>
                    <td th:text="${item.product.price}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${item.product.price * item.quantity}"></td>
                    <td>
                        <form method="post" style="display:inline" th:action="@{|/cart/remove/${item.product.id}|}">
                            <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i> Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div>
                    <span class="fw-bold">Tổng số lượng:</span> <span th:text="${count}"></span>
                    <span class="fw-bold ms-3">Tổng tiền:</span> <span th:text="${total}"></span> VNĐ
                </div>
                <div>
                    <form method="post" style="display:inline" th:action="@{/cart/clear}">
                        <button class="btn btn-warning btn-sm"><i class="bi bi-x-circle"></i> Xóa toàn bộ</button>
                    </form>
                    <a class="btn btn-outline-primary btn-sm ms-2" href="/products"><i class="bi bi-box"></i> Thêm hàng</a>
                    <a class="btn btn-outline-secondary btn-sm ms-2" href="/"><i class="bi bi-house"></i> Trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
